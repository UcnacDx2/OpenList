name: Temporary 139 Driver Tests

on:
  push:
    branches:
      - verify/139-login-combined-ci

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.0"
      - name: Test 139 driver
        run: go test ./drivers/139 -count=1
